# D2: Liberty files of the SRAM macro from ngspice characterization (OpenRAM sram_char.py), one job per corner.
# Takes hours, so it runs only on pushes to char/* branches (or by hand once this file is on the default branch).
#   each job: build the macro (flow/build_macro.sh, INSTALL=0) to get OpenRAM's netlist of it, then
#             flow/characterize.sh <corner> <netlist> (ngspice), then flow/lib_sanity.py.
name: characterize macro

on:
  push:
    branches: ['char/**']
  workflow_dispatch:
    inputs:
      corners:
        description: 'JSON list of corners'
        default: '["TT","SS","FF"]'

permissions:
  contents: read

jobs:
  char:
    strategy:
      fail-fast: false
      matrix:
        corner: ${{ fromJSON(inputs.corners || '["TT","SS","FF"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Nix (OpenRAM's flake provides ngspice, magic, netgen)
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache OpenRAM's SKY130 PDK and SRAM cell library
        uses: actions/cache@v4
        with:
          path: |
            ~/OpenRAM/skywater-pdk
            ~/OpenRAM/ciel
            ~/OpenRAM/sky130A
            ~/OpenRAM/sky130_fd_bd_sram
            ~/OpenRAM/technology/sky130/*_lib
          key: openram-pdk-2f7b3866-sky130-e8294524

      - name: Rebuild the macro (OpenRAM netlist for characterization)
        run: INSTALL=0 flow/build_macro.sh char

      - name: Characterize ${{ matrix.corner }} with ngspice
        run: flow/characterize.sh ${{ matrix.corner }} build/macro_runs/char/raw/tt_sram_8x32_wpr1.sp 2>&1 | tee char_${{ matrix.corner }}.txt; exit ${PIPESTATUS[0]}

      - name: Summary
        if: always()
        run: |
          { echo '### ${{ matrix.corner }}'; echo '```'; tail -80 char_${{ matrix.corner }}.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload .lib and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lib_${{ matrix.corner }}
          path: |
            build/macro/lib
            build/char
            char_${{ matrix.corner }}.txt
          retention-days: 30

      - name: Upload OpenRAM temp files (only when it failed, for debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openram_temp_${{ matrix.corner }}
          path: /tmp/openram_*_temp
          retention-days: 7
